{% load static %}<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | AcxiomCRM</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body class="login-body"><form method="post" class="login-card">{% csrf_token %}<div class="brand login-brand"><span class="brand-mark">A</span><span>Acxiom<span class="brand-light">CRM</span></span></div><h1>Welcome back</h1><p class="muted">Sign in to continue to your workspace.</p>{% if form.errors %}<div class="alert error">Username or password is incorrect.</div>{% endif %}<label>Username</label>{{ form.username }}<label>Password</label>{{ form.password }}<button class="btn primary full" type="submit">Sign in to workspace →</button><small class="muted">Create your first login with <code>python manage.py createsuperuser</code></small></form></body></html>
